# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# SDD documentation and Spec-Kit tooling are authored artifacts, not source code:
# keep the fixer/formatter hooks out of them so runs stay scoped to code changes.
exclude: '^(\.specify/|specs/|\.github/agents/)'

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
        -   --unsafe
      - id: end-of-file-fixer
      - id: trailing-whitespace

-   repo: local
    hooks:
      - id: local-ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix --exit-non-zero-on-fix
        require_serial: true
        language: system
        types: [python]

      - id: local-ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude --exit-non-zero-on-format
        require_serial: true
        language: system
        types: [python]

      - id: local-mypy
        name: mypy check
        entry: uv run mypy src/
        require_serial: true
        language: system
        pass_filenames: false
