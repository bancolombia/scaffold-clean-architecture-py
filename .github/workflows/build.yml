name: Build

on:
  push:
    branches:
      - trunk
      - feature/*

  pull_request:
    branches:
      - trunk

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify Conventional Commits
        uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install virtualenv
          sudo apt-get update
          sudo apt-get install openssh-client -y

      - name: Run Unit Test
        run: |
          python -m virtualenv _venv
          source _venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
          python -m pip install -r requirements.txt
          python -m pytest -x --cov=scaffold-clean-architecture-py --cov-config=.coveragerc
          python -m coverage report -m
          python -m coverage xml

      - name: Run analysis on SonarQube
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.organization=grupo-bancolombia
            -Dsonar.projectKeyscaffold-clean-architecture-py
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.language=py
            -Dsonar.verbose=true
            -Dsonar.exclusions=**/test/**,**/example/**,**setup.py**,**hello_world**,**Dockerfile**,**/coverage/**
            -Dsonar.coverage.exclusions=**/test/**,**/example/**,**setup.py**,**hello_world**,**Dockerfile/**,**/coverage/**
