[project]
name = "clean-architecture-scaffold"
version = "0.1.0"
description = "Clean Architecture Scaffold para Microservicios en Python"
authors = [
    {name = "Jesus Alberto Arcia Hernandez",email = "jarcia@bancolombia.com.co"}
]
readme = "README.md"
packages = [{include = "src"}]
requires-python = ">=3.9,<4.0"
dependencies = [
    "fastapi (>=0.115.11,<0.116.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "pydantic (>=2.10.6,<3.0.0)",
    "dependency-injector (>=4.46.0,<5.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "sqlalchemy (>=2.0.39,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "opentelemetry-api (>=1.31.0,<2.0.0)",
    "opentelemetry-sdk (>=1.31.0,<2.0.0)",
    "opentelemetry-exporter-otlp (>=1.31.0,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.52b0,<0.53)",
    "opentelemetry-instrumentation-psycopg2 (>=0.52b0,<0.53)"
]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.0.0"
freezegun = "^1.5.1"
httpx = "^0.28.1"
black = "^23.0"
flake8 = "^6.0"


[tool.poetry]
package-mode = false

