[project]
name = "scaffold-ca-python"
dynamic = ["version"]
description = "Scaffolder to generate Clean Architecture apps"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Santiago Calle", email = "santiagocalleg@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["clean architecture", "scaffold", "code generation", "cli", "python", "mcp", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Typing :: Typed",
]
dependencies = [
    "libcst~=1.8.5",
    "jinja2~=3.1.6",
    "pydantic~=2.13.5",
    "pyyaml~=6.0.3",
    "tomli-w~=1.2.0",
    "typer~=0.27.2",
    "rich~=15.0.0",
]

[dependency-groups]
dev = [
    { include-group = "tests" },
    "prek>=0.5.3",
    "types-pyyaml>=6.0.12.20260906",
]

tests = [
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
scaffold-ca-python = "scaffold_ca_python.cli:app"
scaffold = "scaffold_ca_python.cli:app"

[project.urls]
Homepage = "https://github.com/bancolombia/scaffold-clean-architecture-py"
Repository = "https://github.com/bancolombia/scaffold-clean-architecture-py"
Issues = "https://github.com/bancolombia/scaffold-clean-architecture-py/issues"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[tool.hatch.build.targets.wheel]
packages = ["src/scaffold_ca_python"]

[tool.ruff]
line-length = 120
target-version = "py313"
# Fixture projects reproduce scaffolder output verbatim (0.5.0 was never formatted).
extend-exclude = ["tests/fixtures"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "B", "SIM", "C90", "ERA", "PT", "PLR0917", "ARG"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures are often requested only for their side effects.
"tests/**" = ["ARG"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that require uv sync on generated projects (slow)",
    "benchmark: performance tests (excluded from default runs)",
]
addopts = "-m 'not e2e and not benchmark' --cov=scaffold_ca_python --cov-fail-under=80"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.coverage.run]
source = ["scaffold_ca_python"]
